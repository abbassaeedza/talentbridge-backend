services:
  - type: web
    name: talentbridge-backend
    runtime: docker
    plan: free
    branch: main
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: '86400000'
      - key: JWT_REFRESH_EXPIRATION
        value: '604800000'
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: talentbridge-files
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: APP_DEMO_MODE
        value: 'true'
      - key: APP_SEED_COORDINATOR_EMAIL
        sync: false
      - key: APP_SEED_COORDINATOR_PASSWORD
        sync: false
      - key: PARTY_MIN_SIZE
        value: '2'
      - key: PARTY_MAX_SIZE
        value: '3'
