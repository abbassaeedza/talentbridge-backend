services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: talentbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentbridge
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: talentbridge123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentbridge -d talentbridge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Backend ───────────────────────────────────────────────
